# Pipeline: Face Detection
name: Face Detection Pipeline
version: '0.1'

Nodes:
  - node: VideoDecoder
    instance: decoder_0
    profile:
      thread: video_decoder
      publish:
        - OpenCVFrame
      private:
        file: trailer.mp4
        fps: 10
  - node: FaceDetector
    instance: detector_0
    profile:
      thread: face_detector
      subscribe:
        - OpenCVFrame
      publish:
        - FaceDetectFrame
      private:
        model : E:\LC\work\project\qt_cpp\mysql\data\res10_300x300_ssd_iter_140000.caffemodel
        config_file : E:\LC\work\project\qt_cpp\mysql\data\deploy.prototxt
  - node: OpencvDisplay
    instance: displayer_0
    profile:
      thread: video_display
      subscribe:
        - FaceDetectFrame
      private:
        fps: 30
        win_name: "Face Detection"
        win_scale: 0.25
