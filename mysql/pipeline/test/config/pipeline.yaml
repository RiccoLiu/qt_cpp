# pipeline profile for perception
name : perception pipeline
version : '0.1'
Nodes :
- #node 1
  node : RV1126ReaderNode
  profile :
   thread : rv1126reader
   Sources :
   - OpenCVFrame
   - GNSS
   Sinks :
   - VideoControl
   private :
    logType : file
    msgManager :
     ignoreFrame : 1200
     slowLevel : 10
     debugConfig :
     #- all
     - resultCam
     #- resultGNSS
     - ignoreCam
     - error
     #- debug
    dataMatch :
     camera : ./mx_camera.yaml
     discardFrame : 6
     debugConfig :
     #- all
     #- handleAll
     #- handleAllMsg
     #- matchResult
     #- matchFailed
     #- handleIMGDiscard
     #- handleIMG
     #- handleEBD
     #- handleXVS
     #- handlePPS
     #- handleRTK
     - handleError
    logFile :
     RV1126 :
      dir : /home/jiasj/onboard/20220314/
     GNSS :
      path : /home/jiasj/onboard/20220314/rtk.log
    logOnline :
     RV1126 :
      ip : 10.42.0.125
      port : 8765
     GNSS :
      path : /dev/ttyUSB0
      speed : 460800
      #speed : 1500000
      debugConfig :
      - statusChange
      - msg
      #- errorMsg
      #- openFailed
- #node 2
  node : slam/VisualFrontend
  instance : VisualFrontend
  profile :
   thread : slam
   Sources :
   - VisualFrontendSrc
   Sinks :
   - CVRenderFrame
   private :
    comment : nothing
    FavoriteDescriptor : REPAlgorithm
- #node 6
  node : OpenCVDisplay
  instance : display
  profile :
   thread : display
   Sources :
   - VideoControl
   Sinks :
   - CVRenderFrame
   private :
    comment : nothing
    WinName : OpenCV Window
    WinSize : 0.25
    ControlBar :
     FPS : 10
     Progress : 100
     Source : VideoControl
- #node 7
  node : Visualization
  instance : display
  profile :
   thread : display
   Sources :
   - VideoControl
   Sinks :
   - CVRenderFrame
   - GNSS
   private :
    comment : nothing
    WinName : Visualization Window
    WinSize : 0.25
    LocalMapping:
     KeyFrameSize : 20
     KeyFrameLineWidth : 1.0
     GraphLineWidth : 1.0
     PointSize : 5.0
     CameraSize : 1.0
     CameraLineWidth : 1.0
- #node 8
  node : slam/PerceptionNode
  instance : PerceptionNode
  profile :
   thread : PerceptionNode
   Sources :
   - VideoControl
   Sinks :
   - CVRenderFrame
   private :
    ModelPath : ./segformer_3_25.pt
    SegLog : /home/jiasj/logpic45/
- #node 9
  node : slam/SensorSyncNode
  profile :
   thread : sensorsync
   Sources :
   - SensorSync
   Sinks :
   - GNSS
   - OpenCVFrame
   private :
    debugConfig :
    #- all
    - match
    - notMatch
    #- discardGNSS
    #- receiveMsg
    #- showImg
Edges :
- #edge 5
  from :
  - RV1126ReaderNode
  - OpenCVFrame
  to :
  - slam/SensorSyncNode
  - OpenCVFrame
- #edge 6
  from :
  - slam/SensorSyncNode
  - SensorSync
  to :
  - slam/VisualFrontend::VisualFrontend
  - CVRenderFrame
- #edge 7
  from :
  - OpenCVDisplay::display
  - VideoControl
  to :
  - RV1126ReaderNode
  - VideoControl
- #edge 8
  from :
  - slam/VisualFrontend::VisualFrontend
  - VisualFrontendSrc
  to :
  - OpenCVDisplay::display
  - CVRenderFrame
- #edge 9
  from :
  - RV1126ReaderNode
  - GNSS
  to :
  - Visualization::display
  - GNSS

- #edge 10
  from :
  - slam/VisualFrontend::VisualFrontend
  - VisualFrontendSrc
  to :
  - slam/PerceptionNode::PerceptionNode
  - CVRenderFrame
- #edge 11
  from :
  - RV1126ReaderNode
  - GNSS
  to :
  - slam/SensorSyncNode
  - GNSS
Startups :
- OpenCVDisplay::display
#- Visualization::display
